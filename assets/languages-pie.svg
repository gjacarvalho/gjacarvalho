<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Distribuição de linguagens</title>
  <desc id="desc">Gráfico de pizza: Python 56,7%, JavaScript 23,1%, Jupyter Notebook 14,2%, HTML 4%, CSS 1,4% e Java 0,6%.</desc>
  <rect width="760" height="360" rx="18" fill="#0d1117"/>
  <text x="48" y="58" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700">Linguagens dos projetos privados</text>
  <text x="48" y="86" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Distribuição por linhas de código identificadas pelo GitHub</text>
  <g transform="translate(190 205) rotate(-90)">
    <circle r="110" fill="none" stroke="#21262d" stroke-width="70"/>
    <circle r="110" fill="none" stroke="#3572A5" stroke-width="70" stroke-dasharray="391.80 299.35" stroke-dashoffset="0"/>
    <circle r="110" fill="none" stroke="#f1e05a" stroke-width="70" stroke-dasharray="159.65 531.50" stroke-dashoffset="-391.80"/>
    <circle r="110" fill="none" stroke="#DA5B0B" stroke-width="70" stroke-dasharray="98.22 592.93" stroke-dashoffset="-551.45"/>
    <circle r="110" fill="none" stroke="#e34c26" stroke-width="70" stroke-dasharray="27.65 663.50" stroke-dashoffset="-649.67"/>
    <circle r="110" fill="none" stroke="#563d7c" stroke-width="70" stroke-dasharray="9.68 681.47" stroke-dashoffset="-677.32"/>
    <circle r="110" fill="none" stroke="#b07219" stroke-width="70" stroke-dasharray="4.15 687.00" stroke-dashoffset="-687.00"/>
  </g>
  <circle cx="190" cy="205" r="69" fill="#0d1117"/>
  <text x="190" y="198" fill="#f0f6fc" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700">6</text>
  <text x="190" y="222" fill="#8b949e" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">linguagens</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">
    <circle cx="365" cy="132" r="7" fill="#3572A5"/><text x="383" y="138" fill="#f0f6fc">Python <tspan fill="#8b949e">56,7%</tspan></text>
    <circle cx="365" cy="170" r="7" fill="#f1e05a"/><text x="383" y="176" fill="#f0f6fc">JavaScript <tspan fill="#8b949e">23,1%</tspan></text>
    <circle cx="365" cy="208" r="7" fill="#DA5B0B"/><text x="383" y="214" fill="#f0f6fc">Jupyter Notebook <tspan fill="#8b949e">14,2%</tspan></text>
    <circle cx="365" cy="246" r="7" fill="#e34c26"/><text x="383" y="252" fill="#f0f6fc">HTML <tspan fill="#8b949e">4,0%</tspan></text>
    <circle cx="555" cy="132" r="7" fill="#563d7c"/><text x="573" y="138" fill="#f0f6fc">CSS <tspan fill="#8b949e">1,4%</tspan></text>
    <circle cx="555" cy="170" r="7" fill="#b07219"/><text x="573" y="176" fill="#f0f6fc">Java <tspan fill="#8b949e">0,6%</tspan></text>
  </g>
</svg>
