<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
  <title id="title">Distribuição das linguagens usadas</title>
  <desc id="desc">Python representa 56,7%, JavaScript 23,1%, Jupyter Notebook 14,2%, HTML 4%, CSS 1,4% e Java 0,6%.</desc>
  <rect width="700" height="340" rx="12" fill="#0d1117"/>
  <text x="42" y="48" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">Linguagens dos projetos privados</text>
  <text x="42" y="75" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Distribuição por arquivos identificados pelo GitHub</text>
  <g transform="translate(184 195) rotate(-90)">
    <circle r="75" fill="none" stroke="#21262d" stroke-width="42"/>
    <circle r="75" fill="none" stroke="#3572A5" stroke-width="42" stroke-dasharray="267.18 204.06" stroke-dashoffset="0"/>
    <circle r="75" fill="none" stroke="#f1e05a" stroke-width="42" stroke-dasharray="108.85 362.39" stroke-dashoffset="-267.18"/>
    <circle r="75" fill="none" stroke="#DA5B0B" stroke-width="42" stroke-dasharray="66.91 404.33" stroke-dashoffset="-376.03"/>
    <circle r="75" fill="none" stroke="#e34c26" stroke-width="42" stroke-dasharray="18.85 452.39" stroke-dashoffset="-442.94"/>
    <circle r="75" fill="none" stroke="#563d7c" stroke-width="42" stroke-dasharray="6.60 464.64" stroke-dashoffset="-461.79"/>
    <circle r="75" fill="none" stroke="#b07219" stroke-width="42" stroke-dasharray="2.83 468.41" stroke-dashoffset="-468.39"/>
  </g>
  <circle cx="184" cy="195" r="53" fill="#0d1117"/>
  <text x="184" y="192" fill="#f0f6fc" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">6</text>
  <text x="184" y="216" fill="#8b949e" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">linguagens</text>
  <line x1="330" y1="103" x2="330" y2="280" stroke="#30363d" stroke-width="1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">
    <circle cx="365" cy="113" r="7" fill="#3572A5"/><text x="383" y="119" fill="#f0f6fc">Python</text><text x="650" y="119" text-anchor="end" fill="#8b949e">56,7%</text>
    <circle cx="365" cy="145" r="7" fill="#f1e05a"/><text x="383" y="151" fill="#f0f6fc">JavaScript</text><text x="650" y="151" text-anchor="end" fill="#8b949e">23,1%</text>
    <circle cx="365" cy="177" r="7" fill="#DA5B0B"/><text x="383" y="183" fill="#f0f6fc">Jupyter Notebook</text><text x="650" y="183" text-anchor="end" fill="#8b949e">14,2%</text>
    <circle cx="365" cy="209" r="7" fill="#e34c26"/><text x="383" y="215" fill="#f0f6fc">HTML</text><text x="650" y="215" text-anchor="end" fill="#8b949e">4,0%</text>
    <circle cx="365" cy="241" r="7" fill="#563d7c"/><text x="383" y="247" fill="#f0f6fc">CSS</text><text x="650" y="247" text-anchor="end" fill="#8b949e">1,4%</text>
    <circle cx="365" cy="273" r="7" fill="#b07219"/><text x="383" y="279" fill="#f0f6fc">Java</text><text x="650" y="279" text-anchor="end" fill="#8b949e">0,6%</text>
  </g>
</svg>
